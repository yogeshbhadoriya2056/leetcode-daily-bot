
name: Safe Workflow Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout bot repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests curl_cffi==0.16.2

      - name: Check Python syntax
        run: |
          python -m py_compile solve.py hackerrank.py striver.py

      - name: Check Striver progress files
        run: |
          python - <<'PY'
          from pathlib import Path

          slugs_file = Path("striver_slugs.txt")
          progress_file = Path("striver_progress.txt")

          if not slugs_file.exists():
              raise SystemExit("ERROR: striver_slugs.txt is missing")

          if not progress_file.exists():
              raise SystemExit("ERROR: striver_progress.txt is missing")

          slugs = [
              line.strip()
              for line in slugs_file.read_text().splitlines()
              if line.strip()
          ]

          raw_progress = progress_file.read_text().strip()

          try:
              progress = int(raw_progress)
          except ValueError:
              raise SystemExit("ERROR: Progress index must be an integer")

          if progress < 0 or progress > len(slugs):
              raise SystemExit(
                  f"ERROR: Progress index {progress} is invalid. "
                  f"Expected 0 to {len(slugs)}."
              )

          print("Striver progress files are valid.")
          print(f"Total problems listed: {len(slugs)}")
          print(f"Current progress index: {progress}")
          PY

      - name: Finish safe test
        run: |
          echo "SUCCESS: All safe checks completed."
          echo "No LeetCode or HackerRank solutions were submitted."
          echo "No repository changes were pushed."
