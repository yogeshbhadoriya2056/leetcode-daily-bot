name: Daily Coding Bot - Safe Automation

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 00:15 UTC (05:45 India Standard Time)
    - cron: "15 0 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bot repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests curl_cffi==0.16.2

      - name: Check Python syntax
        run: python -m py_compile solve.py hackerrank.py striver.py

      - name: Check Striver progress files
        run: |
          python - <<'PY'
          from pathlib import Path

          slugs_file = Path("striver_slugs.txt")
          progress_file = Path("striver_progress.txt")

          if not slugs_file.exists():
              raise SystemExit("ERROR: striver_slugs.txt is missing")
          if not progress_file.exists():
              raise SystemExit("ERROR: striver_progress.txt is missing")

          slugs = [
              line.strip()
              for line in slugs_file.read_text().splitlines()
              if line.strip()
          ]
          try:
              progress = int(progress_file.read_text().strip())
          except ValueError:
              raise SystemExit("ERROR: Progress index must be an integer")

          if progress < 0 or progress > len(slugs):
              raise SystemExit(
                  f"ERROR: Progress index {progress} is invalid; "
                  f"expected 0 to {len(slugs)}."
              )

          print(f"Progress files valid: {len(slugs)} listed problems; index {progress}.")
          PY

      - name: Send Telegram status
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping notification."
            exit 0
          fi

          python - <<'PY'
          import os
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          status = os.environ.get("JOB_STATUS", "unknown")
          repo = os.environ.get("REPOSITORY", "repository")
          run_url = os.environ.get("RUN_URL", "")

          message = (
              f"Daily coding bot safe checks: {status}\n"
              f"Repository: {repo}\n"
              f"Run: {run_url}\n\n"
              "This workflow checks Python syntax and progress files only. "
              "It does not submit solutions or push repository changes."
          )
          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data={"chat_id": chat_id, "text": message},
              timeout=20,
          )
          response.raise_for_status()
          if not response.json().get("ok"):
              raise SystemExit("Telegram API did not confirm the message.")
          print("Telegram status notification sent.")
          PY

      - name: Safe completion summary
        run: |
          echo "Safe daily checks completed."
          echo "No LeetCode or HackerRank solutions were submitted."
          echo "No repository changes were pushed."
